name: Sync Kubex Installation Documentation

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  sync-installation:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync Installation section
        run: python3 .github/scripts/sync-kubex-installation.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'docs: sync Kubex installation instructions'
          title: 'Update Kubex installation instructions'
          body: |
            This PR synchronizes the Kubex Collection Stack Installation section with the upstream Helm chart README.

            Source: https://github.com/densify-dev/helm-charts/blob/master/charts/kubex-automation-stack/README.md#installation
          branch: sync-kubex-installation
          delete-branch: true
          labels: documentation, automated
